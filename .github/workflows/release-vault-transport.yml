name: Publish qualified MetropolisJS Vault transport

on:
  push:
    branches: [codex/vault-metropolis-transport-release]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.mts'
      - '**/*.cts'

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  group: metropolisjs-package-release

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify exact candidate intent and authenticated baseline
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/vault-metropolis-transport-release
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node -p "require('./package.json').name")" = @nlabs/metropolisjs
          test "$(node -p "require('./package.json').version")" = 1.8.5
          test "$(node -p "require('./package-lock.json').packages[''].version")" = 1.8.5
          mkdir -p "$RUNNER_TEMP/metropolis-release"
          npm whoami > /dev/null
          npm view @nlabs/metropolisjs dist-tags --json --prefer-online > "$RUNNER_TEMP/metropolis-release/tags-before.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          assert.equal(JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/metropolis-release/tags-before.json`)).latest, '1.8.4');
          const result = spawnSync('npm', ['view', '@nlabs/metropolisjs@1.8.5', 'version', '--json', '--prefer-online'], {encoding: 'utf8'});
          assert.notEqual(result.status, 0, 'Version exists; do not repeat publication.');
          assert.equal(JSON.parse(result.stdout).error.code, 'E404');
          NODE
      - name: Install without lifecycle scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm ci --ignore-scripts
      - name: Verify owner tests, build and public declarations
        run: |
          set -euo pipefail
          npm test
          npm run build
          npm run typecheck
          node --input-type=module <<'NODE'
          import {resolveBinaryPath} from '@nlabs/lex';
          import {spawnSync} from 'node:child_process';
          for(const [binary, owner, args] of [
            ['tsc', 'typescript', ['-p', 'tsconfig.vault-public.json']],
            ['tsc', 'typescript', ['-p', 'tsconfig.vault-public.json', '--module', 'Preserve', '--moduleResolution', 'Bundler', '--noEmit']],
            ['eslint', 'eslint', ['--config', 'eslint.vault-transport.config.mjs', 'eslint.vault-transport.config.mjs', 'lex.config.mjs', 'src/actions/durableChatActions/durableChatActions.test.ts', 'src/actions/webSessionActions/webSessionActions.test.ts', 'src/githooks.test.ts', 'src/utils/location.test.ts', 'src/utils/api.credentials.test.ts', 'test-utils/vaultTransportPublicConsumer.mts', 'tests/web-session-transport-server.mjs', '--max-warnings', '0']]
          ]) {
            const result = spawnSync(process.execPath, [resolveBinaryPath(binary, owner), ...args], {stdio: 'inherit'});
            if(result.status !== 0) process.exit(result.status ?? 1);
          }
          NODE
          node .tmp/vault-public/vaultTransportPublicConsumer.mjs
      - name: Freeze immutable publication artifact
        id: archive
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/metropolis-release"
          METROPOLIS_ARCHIVE="$RUNNER_TEMP/metropolis-release/nlabs-metropolisjs-1.8.5.tgz"
          sha256sum "$METROPOLIS_ARCHIVE" > "$RUNNER_TEMP/metropolis-release/SHA256SUMS"
          printf 'path=%s\n' "$METROPOLIS_ARCHIVE" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/metropolis-release/source-sha.txt"
      - name: Qualify exact archive in independent public consumer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          METROPOLIS_ARCHIVE: ${{ steps.archive.outputs.path }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/metropolis-public-consumer"
          cp test-utils/vaultTransportPublicConsumer.mts "$RUNNER_TEMP/metropolis-public-consumer/contract.mts"
          cd "$RUNNER_TEMP/metropolis-public-consumer"
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          writeFileSync('package.json', JSON.stringify({private: true, type: 'module', dependencies: {
            '@nlabs/arkhamjs': '3.31.16', '@nlabs/arkhamjs-storage-browser': '3.31.0',
            '@nlabs/arkhamjs-utils-react': '3.33.0', '@nlabs/metropolisjs': process.env.METROPOLIS_ARCHIVE,
            '@nlabs/rip-hunter': '3.5.1', react: '19.3.1'
          }, devDependencies: {'@nlabs/lex': '2.1.2', '@types/node': '26.6.6', '@types/react': '19.3.0'}}));
          writeFileSync('tsconfig.json', JSON.stringify({compilerOptions: {jsx: 'react-jsx', module: 'NodeNext',
            moduleResolution: 'NodeNext', outDir: 'dist', skipLibCheck: false, strict: true,
            target: 'ES2022', types: ['node', 'react']}, include: ['contract.mts']}));
          NODE
          npm install --ignore-scripts --no-audit --no-fund
          npm ls @nlabs/rip-hunter @nlabs/arkhamjs @nlabs/arkhamjs-utils-react react vitest @vitest/coverage-v8 typescript --all
          node --input-type=module <<'NODE'
          import {resolveBinaryPath} from '@nlabs/lex';
          import {spawnSync} from 'node:child_process';
          for(const args of [['-p', 'tsconfig.json'], ['-p', 'tsconfig.json', '--module', 'Preserve', '--moduleResolution', 'Bundler', '--noEmit']]) {
            const result = spawnSync(process.execPath, [resolveBinaryPath('tsc', 'typescript'), ...args], {stdio: 'inherit'});
            if(result.status !== 0) process.exit(result.status ?? 1);
          }
          NODE
          node dist/contract.mjs
          sha256sum --check "$RUNNER_TEMP/metropolis-release/SHA256SUMS"
      - name: Retain qualified archive
        uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          if-no-files-found: error
          name: metropolis-vault-publication
          path: ${{ runner.temp }}/metropolis-release/
      - name: Publish exact archive with explicit candidate tag
        env:
          METROPOLIS_ARCHIVE: ${{ steps.archive.outputs.path }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          sha256sum --check "$RUNNER_TEMP/metropolis-release/SHA256SUMS"
          npm exec -- lex publish --packagePath "$METROPOLIS_ARCHIVE" --tag vault-cutover
          sha256sum --check "$RUNNER_TEMP/metropolis-release/SHA256SUMS"
      - name: Verify registry payload and tags without repeating publication
        env:
          METROPOLIS_ARCHIVE: ${{ steps.archive.outputs.path }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          until npm view @nlabs/metropolisjs@1.8.5 version dist.integrity --json --prefer-online --fetch-retries=0 --fetch-timeout=20000 > "$RUNNER_TEMP/metropolis-release/registry.json"; do
            if ((SECONDS >= deadline)); then echo 'Publication visibility unresolved; do not republish.' >&2; exit 1; fi
            sleep 20
          done
          mkdir "$RUNNER_TEMP/metropolis-release/registry"
          npm pack @nlabs/metropolisjs@1.8.5 --ignore-scripts --pack-destination "$RUNNER_TEMP/metropolis-release/registry"
          cmp "$METROPOLIS_ARCHIVE" "$RUNNER_TEMP/metropolis-release/registry/nlabs-metropolisjs-1.8.5.tgz"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFileSync} from 'node:fs';
          const registry = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/metropolis-release/registry.json`));
          assert.equal(registry.version, '1.8.5');
          assert.equal(registry['dist.integrity'], 'sha512-' + createHash('sha512').update(readFileSync(process.env.METROPOLIS_ARCHIVE)).digest('base64'));
          NODE
          while true; do
            if npm view @nlabs/metropolisjs dist-tags --json --prefer-online --fetch-retries=0 --fetch-timeout=20000 > "$RUNNER_TEMP/metropolis-release/tags-after.json"; then
              if node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {isDeepStrictEqual} from 'node:util';
          const directory = `${process.env.RUNNER_TEMP}/metropolis-release`;
          const read = (name) => JSON.parse(readFileSync(`${directory}/${name}`));
          const before = read('tags-before.json');
          const after = read('tags-after.json');
          if(isDeepStrictEqual(after, {...before, 'vault-cutover': '1.8.5'})) process.exit(0);
          if(isDeepStrictEqual(after, before)) process.exit(75);
          console.error('Registry tags conflict with the reviewed intent.');
          process.exit(1);
          NODE
              then break; else status=$?; fi
              if ((status != 75)); then exit "$status"; fi
            fi
            remaining=$((deadline - SECONDS))
            if ((remaining <= 0)); then echo 'Tag visibility unresolved; do not republish.' >&2; exit 1; fi
            duration=20
            if ((remaining < duration)); then duration=$remaining; fi
            sleep "$duration"
          done
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          if-no-files-found: warn
          name: metropolis-vault-release-evidence
          path: ${{ runner.temp }}/metropolis-release/
